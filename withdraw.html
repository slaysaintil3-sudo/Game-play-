
<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MONEYHTG PRO - Withdraw</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#080d1b;color:white;font-family:Arial}
.container{max-width:520px;margin:auto}
.card{background:#121d32;padding:20px;border-radius:16px;margin-bottom:18px;border:1px solid #253652}
h2{color:#27e6a0}
.balance{background:linear-gradient(135deg,#087b63,#123e70);padding:20px;border-radius:15px;font-size:25px;font-weight:bold}
input,select{width:100%;padding:14px;margin:9px 0;background:#081326;color:white;border:1px solid #354968;border-radius:9px;font-size:15px}
button{width:100%;padding:14px;border:0;border-radius:10px;background:#16c995;color:#061a17;font-weight:bold;margin-top:10px;font-size:15px}
button:disabled{opacity:.45}
.secondary{background:#263a57;color:white}
.small{color:#aab8cc;font-size:13px}
.item{background:#192944;padding:12px;border-radius:10px;margin-top:10px;font-size:14px}
#message{color:#ffcc70;margin-top:12px}
.notice{background:#382b16;color:#ffdb91;padding:12px;border-radius:10px;margin-top:12px;font-size:14px}
</style>
</head>
<body>
<div class="container">

<div class="card">
<h2>💰 MONEYHTG PRO</h2>
<p>Demann retrè</p>
<p class="small" id="userEmail">Verifikasyon kont...</p>
<button class="secondary" onclick="goHome()">Retounen lakay</button>
</div>

<div class="balance">
<div class="small">Balans disponib</div>
<div><span id="balance">0</span> HTG</div>
</div>

<div class="card">
<h2>📤 Fè retrè</h2>
<div id="activeNotice" class="notice" hidden>
Ou deja gen yon demann aktif. Tann Admin fin trete li.
</div>

<label>Montan (HTG)</label>
<input id="amount" type="number" min="1" step="1" placeholder="Antre montan an">

<label>Metòd peman</label>
<select id="method">
<option value="MonCash">MonCash</option>
<option value="NatCash">NatCash</option>
</select>

<label>Nimewo telefòn</label>
<input id="phone" type="tel" placeholder="Antre nimewo telefòn ou">

<button id="submitBtn" onclick="sendRequest()">Voye demann retrè</button>
<div id="message"></div>
<p class="small">Demann lan dwe verifye pa Admin. Li pa vle di peman an deja fèt.</p>
</div>

<div class="card">
<h2>📌 Demann aktif</h2>
<div id="activeDetails" class="small">Ap chaje...</div>
</div>

<div class="card">
<h2>📋 Istorik retrè</h2>
<div id="history">Ap chaje...</div>
</div>

</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";
import {getDatabase,ref,get,set,onValue} from "https://www.gstatic.com/firebasejs/13.3.0/firebase-database.js";

const firebaseConfig={
 apiKey:"AIzaSyB7AZhLGZa7kE4qKbmbDBifU9nIwrM3Cgw",
 authDomain:"moneyhtg-60729.firebaseapp.com",
 databaseURL:"https://moneyhtg-60729-default-rtdb.firebaseio.com",
 projectId:"moneyhtg-60729",
 storageBucket:"moneyhtg-60729.firebasestorage.app",
 messagingSenderId:"335775911837",
 appId:"1:335775911837:web:a407029fbad8bfe2b3a974"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getDatabase(app);
const $=id=>document.getElementById(id);

let currentUser=null;
let currentBalance=0;
let hasActiveRequest=false;

function message(txt){$("message").textContent=txt;}

window.goHome=()=>location.href="index.html";

function updateForm(){
 $("submitBtn").disabled=!currentUser||hasActiveRequest;
 $("activeNotice").hidden=!hasActiveRequest;
}

function showItem(container,item){
 const div=document.createElement("div");
 div.className="item";

 const amount=document.createElement("b");
 amount.textContent=(item.amount||0)+" HTG";

 const details=document.createElement("p");
 details.textContent=(item.method||"")+" • "+(item.phone||"");

 const status=document.createElement("p");
 status.textContent="Estati: "+(item.status||"An atant");

 const date=document.createElement("small");
 date.textContent=item.createdAt
  ?new Date(item.createdAt).toLocaleString():"";

 div.append(amount,details,status,date);
 container.appendChild(div);
}

onAuthStateChanged(auth,user=>{
 if(!user){
  currentUser=null;
  $("userEmail").textContent="Ou dwe konekte anvan ou fè retrè.";
  $("activeDetails").textContent="Konekte pou kontinye.";
  $("history").textContent="Konekte pou wè istorik ou.";
  updateForm();
  return;
 }

 currentUser=user;
 $("userEmail").textContent=user.email||"Kont konekte";

 const base="withdrawals/"+user.uid;

 onValue(ref(db,"wallets/"+user.uid+"/balance"),snap=>{
  const value=snap.val();
  currentBalance=typeof value==="number"?value:0;
  $("balance").textContent=currentBalance.toLocaleString();
 });

 onValue(ref(db,base+"/active"),snap=>{
  const item=snap.val();
  hasActiveRequest=!!item;
  updateForm();

  const box=$("activeDetails");
  box.innerHTML="";
  if(item) showItem(box,item);
  else box.textContent="Ou pa gen demann aktif.";
 });

 onValue(ref(db,base+"/history"),snap=>{
  const data=snap.val();
  const box=$("history");
  box.innerHTML="";

  if(!data){
   box.textContent="Ou poko gen okenn demann trete.";
   return;
  }

  Object.values(data).reverse().forEach(item=>showItem(box,item));
 });
});

window.sendRequest=async function(){
 if(!currentUser){
  message("Ou dwe konekte anvan.");
  return;
 }

 if(hasActiveRequest){
  message("Ou deja gen yon demann aktif.");
  return;
 }

 const amount=Number($("amount").value);
 const method=$("method").value;
 const phone=$("phone").value.trim();

 if(!Number.isSafeInteger(amount)||amount<=0){
  message("Antre yon montan antye ki valab.");
  return;
 }

 if(amount>currentBalance){
  message("Balans ou pa ase.");
  return;
 }

 if(!/^[+]?[0-9 ]{8,15}$/.test(phone)){
  message("Antre yon nimewo telefòn ki valab.");
  return;
 }

 const btn=$("submitBtn");
 btn.disabled=true;
 message("Ap voye demann lan...");

 try{
  const activeRef=ref(db,"withdrawals/"+currentUser.uid+"/active");
  const existing=await get(activeRef);

  if(existing.exists()){
   hasActiveRequest=true;
   updateForm();
   message("Ou deja gen yon demann aktif.");
   return;
  }

  const balanceSnap=await get(ref(db,"wallets/"+currentUser.uid+"/balance"));
  const latestBalance=balanceSnap.val();

  if(typeof latestBalance!=="number"||amount>latestBalance){
   message("Balans ou pa ase. Verifye balans ou ankò.");
   return;
  }

  await set(activeRef,{
   uid:currentUser.uid,
   email:currentUser.email||"",
   amount:amount,
   method:method,
   phone:phone,
   status:"An atant",
   createdAt:Date.now()
  });

  $("amount").value="";
  $("phone").value="";
  hasActiveRequest=true;
  updateForm();
  message("Demann ou anrejistre! Li ap tann verifikasyon Admin.");

 }catch(error){
  console.error(error);
  message("Erè Firebase: "+error.message);
 }finally{
  updateForm();
 }
};
</script>
</body>
</html>
